<div *ngIf="this.splashService.getActive()" [@slideInOut] class="hep-custom-splash-screen-overlay">
  <div id="loading-bar"></div>
  <object class="hep-custom-splash-screen-logo" type="image/png" data="assets/logo_HEPVS.png"></object>
  <h1 class="hep-custom-splash-screen-applicationName">
    {{ this.splashService.getApplicationName() }}
  </h1>
  <p *ngIf="this.splashService.getMessage()" class="hep-custom-splash-screen-message">
    {{ this.splashService.getMessage() }}
  </p>
</div>
